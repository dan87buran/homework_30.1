version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    container_name: lms_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для Celery
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django-приложение (web)
  web:
    build: .
    container_name: lms_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app  # монтируем код для автообновления (удобно при разработке)
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  # Celery worker
  celery:
    build: .
    container_name: lms_celery
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A config worker --loglevel=info

  # Celery beat (планировщик периодических задач)
  celery-beat:
    build: .
    container_name: lms_celery_beat
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: